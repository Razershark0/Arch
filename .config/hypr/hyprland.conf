$mod = SUPER

general {
    gaps_in = 10
    gaps_out = 0
    border_size = 2
    col.active_border = rgb(A37E56)
    col.inactive_border = rgb(110915)
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = false
    }
}

windowrulev2 = opacity 0.70 0.70,class:^(Alacritty)$
windowrulev2 = float,class:^(mpv)$

exec-once = hyprpaper
exec-once = waybar
exec-once = dunst
exec-once = hypridle

# Workspaces — same names/icons as the old i3 setup
bind = $mod, 1, workspace, name:1:WEB
bind = $mod, 2, workspace, name:2:TERM
bind = $mod, 3, workspace, name:3:CODE
bind = $mod, 4, workspace, name:4:NET
bind = $mod, 5, workspace, name:5:TOOLS
bind = $mod, 6, workspace, name:6:FILES
bind = $mod, 7, workspace, name:7:NOTES
bind = $mod, 8, workspace, name:8:CHAT
bind = $mod, 9, workspace, name:9:MEDIA
bind = $mod, 0, workspace, name:10:MON

bind = $mod SHIFT, 1, movetoworkspace, name:1:WEB
bind = $mod SHIFT, 2, movetoworkspace, name:2:TERM
bind = $mod SHIFT, 3, movetoworkspace, name:3:CODE
bind = $mod SHIFT, 4, movetoworkspace, name:4:NET
bind = $mod SHIFT, 5, movetoworkspace, name:5:TOOLS
bind = $mod SHIFT, 6, movetoworkspace, name:6:FILES
bind = $mod SHIFT, 7, movetoworkspace, name:7:NOTES
bind = $mod SHIFT, 8, movetoworkspace, name:8:CHAT
bind = $mod SHIFT, 9, movetoworkspace, name:9:MEDIA
bind = $mod SHIFT, 0, movetoworkspace, name:10:MON

# Basic binds
bind = $mod, RETURN, exec, alacritty
bind = $mod, Q, killactive
bind = $mod, D, exec, rofi -show drun
bind = $mod, F, fullscreen

# Volume/mic/brightness OSD, backed by osd.sh
bindel = , XF86AudioRaiseVolume, exec, ~/.local/bin/osd.sh volume-up
bindel = , XF86AudioLowerVolume, exec, ~/.local/bin/osd.sh volume-down
bindel = , XF86AudioMute, exec, ~/.local/bin/osd.sh volume-mute
bindel = , XF86AudioMicMute, exec, ~/.local/bin/osd.sh mic-mute
bindel = , XF86MonBrightnessUp, exec, ~/.local/bin/osd.sh brightness-up
bindel = , XF86MonBrightnessDown, exec, ~/.local/bin/osd.sh brightness-down

cursor {
    inactive_timeout = 3
}
