background {
    monitor =
    color = rgb(17, 9, 21)
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    inner_color = rgb(17, 9, 21)
    outer_color = rgb(163, 126, 86)
    font_color = rgb(195, 193, 196)
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(195, 193, 196)
    font_size = 64
    position = 0, 100
    halign = center
    valign = center
}
