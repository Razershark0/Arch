general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = /home/Raze/.local/bin/matrix-idle.sh
}

listener {
    timeout = 600
    on-timeout = kill $(cat /tmp/matrix-idle.pid 2>/dev/null) 2>/dev/null; systemctl suspend
}
